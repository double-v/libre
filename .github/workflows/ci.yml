name: CI

on:
  # `rc` est la branche de livraison des agents (verrou de livraison par projet,
  # ghwork-control spec 002) : leurs PR y sont fusionnées, jamais dans `main`,
  # et le passage `rc` → `main` reste un geste humain.
  #
  # Sans `rc` ici, une PR qui la vise ne déclenche aucun check — et le contrat
  # d'acceptation refuse de fusionner sur un rollup vide (« vert non prouvé ne
  # vaut pas vert »). La branche serait donc inutilisable.
  #
  # Le `push` compte autant que la `pull_request` : c'est lui qui laisse un run
  # attaché à `rc`, sans quoi l'écart `rc` → `main` s'afficherait en permanence
  # « aucun run de CI ».
  push:
    branches: [main, rc]
  pull_request:
    branches: [main, rc]

# Dépôt public (#548) : le jeton du workflow ne peut que lire. Aucun job n'a
# besoin d'écrire dans le dépôt, les issues ou les paquets.
permissions:
  contents: read

# Un push qui en remplace un autre sur la même réf rend le run précédent inutile :
# on l'annule.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Aucun secret dans ce workflow (#548). Jusque-là, `DATABASE_URL` (la base Neon
# de développement) était passé aux étapes qui suivaient `npm ci` : un script
# d'installation piégé pouvait s'injecter dans ces étapes (`$GITHUB_ENV`,
# `node_modules`) et lire la chaîne de connexion. Désormais :
#   - `npm ci --ignore-scripts` : aucun script d'installation de dépendance ne
#     s'exécute (Prisma est généré explicitement, sharp et esbuild arrivent en
#     binaires précompilés) ;
#   - les tests tournent sur un PostgreSQL jetable, créé pour le run et détruit
#     avec lui. Plus de base partagée, donc plus de verrou de migration disputé
#     entre runs (#313) ni de pooler qui retient ce verrou (#363).

jobs:
  # Lint job — jusqu'à #194 la CI ne lançait QUE vitest, donc les erreurs ESLint
  # (set-state-in-effect, rules-of-hooks, no-explicit-any…) étaient invisibles en
  # CI et pouvaient vivre sur main (cf. #193). Ce job échoue sur toute ERREUR
  # ESLint. Les warnings ne cassent pas le build (pas de --max-warnings) : ils
  # restent visibles dans les logs sans bloquer, à résorber progressivement.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      # Le client Prisma généré (src/generated/) est git-ignoré : on le régénère
      # pour que les imports `@/generated/client/*` résolvent pendant le lint.
      # La génération ne se connecte à aucune base.
      - run: npx prisma generate

      - run: npx eslint .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: libre
          POSTGRES_PASSWORD: libre
          POSTGRES_DB: libre_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libre -d libre_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # Base jetable, propre à ce run : ces valeurs ne sont pas des secrets.
    # `BASE_DE_TEST=1` est exigé par vitest.config.ts en CI : sans lui, la
    # config refuse de démarrer plutôt que de sauter les tests d'intégration.
    env:
      DATABASE_URL: postgresql://libre:libre@localhost:5432/libre_ci
      DATABASE_URL_UNPOOLED: postgresql://libre:libre@localhost:5432/libre_ci
      BASE_DE_TEST: '1'
      NEXTAUTH_SECRET: test-secret-for-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - run: npx prisma generate

      # Toutes les migrations du dépôt, sur une base vide : une migration qui
      # ne s'applique pas proprement depuis zéro fait échouer la PR.
      - run: npx prisma migrate deploy

      # Le jeu factice (domaine `.test`) est semé par le globalSetup de Vitest,
      # qui refuse toute base non locale.
      - run: npx vitest run

      # Playwright E2E tests are intentionally DISABLED on CI for now.
      # Reason: the Vercel preview deploy used for E2E doesn't have the
      # same env config as prod (no real Turnstile key, different IPs
      # for rate-limiting, occasional cold-start flakes), and several
      # recent security fixes (Turnstile fail-closed, rate-limit on
      # /api/auth/*, isBanned check) need local validation before
      # being trusted to pass in CI. Track setup in the issue linked
      # from the project board. To re-enable:
      #   1. Run `npx playwright test` locally and ensure all tests pass
      #   2. Verify the Vercel preview env has the required secrets
      #   3. Uncomment the two steps below
      #
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps
      #
      # - run: npx playwright test
      #   env:
      #     NEXTAUTH_SECRET: test-secret-for-ci
