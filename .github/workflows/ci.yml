name: CI

on:
  # `rc` est la branche de livraison des agents (verrou de livraison par projet,
  # ghwork-control spec 002) : leurs PR y sont fusionnées, jamais dans `main`,
  # et le passage `rc` → `main` reste un geste humain.
  #
  # Sans `rc` ici, une PR qui la vise ne déclenche aucun check — et le contrat
  # d'acceptation refuse de fusionner sur un rollup vide (« vert non prouvé ne
  # vaut pas vert »). La branche serait donc inutilisable.
  #
  # Le `push` compte autant que la `pull_request` : c'est lui qui laisse un run
  # attaché à `rc`, sans quoi l'écart `rc` → `main` s'afficherait en permanence
  # « aucun run de CI ».
  push:
    branches: [main, rc]
  pull_request:
    branches: [main, rc]

# Un push qui en remplace un autre sur la même réf rend le run précédent inutile :
# on l'annule. Ça évite surtout qu'un run mort continue de disputer l'advisory
# lock du job `test` (cf. #313) à celui qui vient de le remplacer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint job — jusqu'à #194 la CI ne lançait QUE vitest, donc les erreurs ESLint
  # (set-state-in-effect, rules-of-hooks, no-explicit-any…) étaient invisibles en
  # CI et pouvaient vivre sur main (cf. #193). Ce job échoue sur toute ERREUR
  # ESLint. Les warnings ne cassent pas le build (pas de --max-warnings) : ils
  # restent visibles dans les logs sans bloquer, à résorber progressivement.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Le client Prisma généré (src/generated/) est git-ignoré : on le régénère
      # pour que les imports `@/generated/client/*` résolvent pendant le lint.
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npx eslint .

  test:
    runs-on: ubuntu-latest

    # `npx prisma migrate deploy` (plus bas) prend un advisory lock PostgreSQL
    # GLOBAL — `pg_advisory_lock(72707369)`, timeout 10 s — sur la base Neon dev
    # que TOUS les runs partagent. Deux runs simultanés, même sur deux PR sans
    # rapport, se disputent ce lock unique : le perdant meurt en `P1002` au step
    # `migrate deploy`, et `vitest` est *skipped*. La PR passe au rouge sans
    # qu'un seul test n'ait tourné, ce qui accuse son contenu à tort. Le 2026-08-08
    # ça avait mis 7 PR Dependabot sur 7 en échec, dont celles qui fermaient une
    # alerte critical (cf. #313).
    #
    # Le groupe est donc volontairement CONSTANT, pas indexé sur `github.ref` :
    # la contention est *entre* branches, un groupe par réf ne réglerait rien.
    # Il est posé sur ce job seul — `lint` ne touche pas la base et reste parallèle.
    #
    # Ce garde-fou reste nécessaire, mais il ne suffisait pas : le 2026-08-23 un
    # `P1002` est survenu alors que la sérialisation avait parfaitement joué (le
    # run `rc` avait bien attendu la fin du run `main`). La seconde moitié de la
    # cause était le POOLER — cf. le commentaire du step de migration plus bas.
    #
    # `cancel-in-progress: false` fait la queue au lieu de tuer le run en cours.
    # Limite connue de GitHub : un seul run peut attendre par groupe ; au-delà,
    # celui qui patientait est annulé. Un « cancelled » reste relançable et
    # lisible, là où le `P1002` induisait en erreur — mais ça reste une rustine.
    # Le vrai fix est une DB éphémère par run (ticket séparé, cf. #313).
    concurrency:
      group: prisma-migrate-shared-dev-db
      cancel-in-progress: false

    # Database: the DATABASE_URL secret is configured at the repo level
    # (Settings → Secrets and variables → Actions) and points at the dev
    # Neon database (user: neondb_owner). GH Actions does NOT auto-inject
    # repo secrets into process.env of a step — they have to be referenced
    # via ${{ secrets.DATABASE_URL }} in an env: block. Each step that
    # needs the database therefore has an explicit env: block. The
    # previous version of this workflow set the env via plain hardcoded
    # localhost:5432 which silently shadowed the secret and broke CI.
    # See #88 for the post-mortem.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Migration : connexion DIRECTE, jamais le pooler.
      #
      # `migrate deploy` prend un advisory lock de SESSION
      # (`pg_advisory_lock(72707369)`). À travers PgBouncer, ce verrou survit au
      # client : la session serveur est rendue au pool en restant propriétaire du
      # verrou, puis recyclée pour d'autres requêtes. Elle ne le relâche jamais.
      # Le run suivant attend 10 s et meurt en `P1002` — sans qu'aucun test n'ait
      # tourné, ce qui accuse son contenu à tort.
      #
      # Observé le 2026-08-23 (run 32629747321, merge de #354) : verrou tenu par
      # une session `application_name = pgbouncer` idle, six minutes après la fin
      # de la migration qui l'avait pris. Le verrou finit par disparaître quand
      # Neon suspend le compute — d'où l'apparence de flakiness : assez long pour
      # tuer un run, assez court pour n'être plus là quand on enquête.
      #
      # Prisma et Neon documentent tous deux la connexion directe pour les
      # migrations. On dérive l'endpoint direct en retirant `-pooler` plutôt que
      # d'ajouter un secret : une seule source de vérité, et rien à resynchroniser
      # le jour où l'URL change. Le `sed` est sans effet si le secret pointe déjà
      # en direct.
      - name: Appliquer les migrations (endpoint direct)
        run: |
          # Ancré sur l'hôte (entre `@` et `/`) : un mot de passe qui
          # contiendrait `-pooler.` ne doit pas être réécrit.
          direct="$(printf '%s' "$DATABASE_URL" | sed 's|@\([^@/]*\)-pooler\.|@\1.|')"
          if [ "$direct" = "$DATABASE_URL" ]; then
            echo "DATABASE_URL vise déjà l'endpoint direct."
          else
            echo "Bascule pooler → direct pour la migration."
          fi

          # `migrate deploy` prend un verrou consultatif de session
          # (`pg_advisory_lock(72707369)`) avec un délai de 10 s non
          # configurable, et la CI meurt dessus au hasard (#363).
          #
          # Le détenteur observé n'est PAS une migration concurrente : c'est une
          # session arrivée **par le pooler**, `idle`, dont la dernière requête
          # est du trafic applicatif ordinaire. Une migration passée par
          # pgbouncer a pris le verrou, puis sa connexion serveur est retournée
          # au pool **sans le relâcher** — le backend sert ensuite des requêtes
          # normales en gardant le verrou de migration. Il se libère quand le
          # pool recycle la connexion.
          #
          # Deux occurrences mesurées (2026-08-24 22:33, 2026-08-25 04:37) : le
          # verrou a tenu plus de 4 minutes. La fenêtre d'attente est calée sur
          # cette durée-là, pas sur celle d'une migration.
          #
          # C'est une ATTÉNUATION. La cause — qui migre encore par le pooler —
          # reste ouverte dans #363, et une base par PR la supprimerait.
          TENTATIVES=8
          for tentative in $(seq 1 "$TENTATIVES"); do
            if DATABASE_URL="$direct" npx prisma migrate deploy; then
              exit 0
            fi
            if [ "$tentative" -lt "$TENTATIVES" ]; then
              echo "::warning::Verrou de migration tenu (tentative $tentative/$TENTATIVES) — nouvel essai dans 30 s."
              sleep 30
            fi
          done
          echo "::error::Verrou de migration toujours tenu après $TENTATIVES tentatives (~5 min). Cf. #363."
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npx vitest run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: test-secret-for-ci

      # Playwright E2E tests are intentionally DISABLED on CI for now.
      # Reason: the Vercel preview deploy used for E2E doesn't have the
      # same env config as prod (no real Turnstile key, different IPs
      # for rate-limiting, occasional cold-start flakes), and several
      # recent security fixes (Turnstile fail-closed, rate-limit on
      # /api/auth/*, isBanned check) need local validation before
      # being trusted to pass in CI. Track setup in the issue linked
      # from the project board. To re-enable:
      #   1. Run `npx playwright test` locally and ensure all tests pass
      #   2. Verify the Vercel preview env has the required secrets
      #   3. Uncomment the two steps below
      #
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps
      #
      # - run: npx playwright test
      #   env:
      #     NEXTAUTH_SECRET: test-secret-for-ci
